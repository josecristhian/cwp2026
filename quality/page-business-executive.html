<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Scorecard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { background: transparent; padding: 0; font-family: 'Segoe UI', sans-serif; margin: 0; overflow: hidden; }

        .page-title {
            margin-bottom: 24px;
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(135deg, #0f172a 0%, #1b98e0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .granularity-bar {
            display: flex; gap: 8px; margin-bottom: 24px; align-items: center;
        }
        .gran-label { font-size: 13px; color: #64748b; font-weight: 600; margin-right: 4px; }
        .gran-btn {
            padding: 6px 16px; border-radius: 20px; border: 1.5px solid #cbd5e1;
            background: white; font-size: 13px; font-weight: 600; color: #64748b;
            cursor: pointer; transition: all .2s;
        }
        .gran-btn.active { background: #1b98e0; color: white; border-color: #1b98e0; }

        .section-title {
            font-size: 15px; font-weight: 700; color: #1e293b;
            margin: 28px 0 14px; padding-bottom: 8px;
            border-bottom: 2px solid #e2e8f0;
            display: flex; align-items: center; gap: 8px;
        }
        .section-title::before {
            content: ''; display: inline-block;
            width: 4px; height: 18px; border-radius: 2px;
            background: linear-gradient(135deg, #1b98e0, #2563eb);
        }

        .charts-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 20px;
        }
        .chart-box {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.07);
            border: 1px solid #f1f5f9;
        }
        .chart-box.full { grid-column: 1 / -1; }
        .chart-box-title {
            font-size: 13px; font-weight: 700; color: #1e293b;
            margin-bottom: 14px;
        }
        .chart-box canvas { max-height: 240px; }

        .loading { padding: 40px; text-align: center; color: #94a3b8; font-size: 14px; }

        @media (max-width: 768px) {
            .charts-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div style="padding: 0;">
    <h2 class="page-title">📊 Executive Scorecard — Métricas Operativas vs. Calidad</h2>

    <div class="granularity-bar">
        <span class="gran-label">Vista:</span>
        <button class="gran-btn active" data-gran="dia" onclick="cambiarGran('dia')">Día</button>
        <button class="gran-btn" data-gran="semana" onclick="cambiarGran('semana')">Semana</button>
        <button class="gran-btn" data-gran="mes" onclick="cambiarGran('mes')">Mes</button>
    </div>

    <div id="contenidoPrincipal">
        <div class="loading">⏳ Cargando datos...</div>
    </div>
</div>

<script>
var granularidad = 'dia';
var globalData = null;

// Chart instances
var chartVol = null;
var chartAHT = null;
var chartNS = null;
var chartScatter = null, chartScatterNS = null, chartScatterVol = null;
var chartVolCanal = null, chartVolSkill = null;
var chartAHTCanal = null, chartAHTSkill = null;
var chartNSCanal  = null, chartNSSkill  = null;

function notifyHeight() {
    window.parent.postMessage({ type: 'RESIZE', height: document.body.scrollHeight }, '*');
}

window.addEventListener('message', (event) => {
    if (event.data.type === 'FILTERED_DATA') {
        // Guardar referencia al rawData del padre para tener siempre acceso a kpis completos
        if (!window.rawData && window.parent && window.parent.rawData) {
            window.rawData = window.parent.rawData;
        }
        cargarPagina(event.data.data);
    }
});

// Carga inicial: intentar desde parent
if (window.parent && (window.parent.filteredData || window.parent.rawData)) {
    if (!window.rawData) window.rawData = window.parent.rawData;
    cargarPagina(window.parent.filteredData || window.parent.rawData);
}

function cambiarGran(g) {
    granularidad = g;
    document.querySelectorAll('.gran-btn').forEach(b => b.classList.toggle('active', b.dataset.gran === g));
    if (globalData) renderScorecard(globalData);
}

function cargarPagina(data) {
    // data puede venir como { kpis, base_excel } (rawData completo)
    // o como { base_excel: registros_filtrados } sin kpis recalculados
    // En ambos casos necesitamos kpis filtrados

    if (!data) return;

    // Si tiene kpis Y base_excel, inferir filtros activos desde base_excel y filtrar kpis
    const rawKpis = (window.rawData && window.rawData.kpis) || data.kpis;
    const base    = data.base_excel;

    if (!rawKpis) return;

    let kpisToUse;

    if (base && base.length > 0) {
        // Inferir dimensiones presentes en el base_excel filtrado
        const bposActivos    = new Set(base.map(r => r.BPO).filter(Boolean));
        const canalesActivos = new Set(base.map(r => r.DATA_CANAL).filter(Boolean));
        const skillsActivos  = new Set(base.map(r => r.DATA_SKILL).filter(Boolean));

        // Construir set de fechas activas desde FECHA DE INTERACCIÓN (mismo formato MM/D/YY que FECHA_REAL en kpis)
        const fechasActivas = new Set(base.map(r => r['FECHA DE INTERACCIÓN']).filter(Boolean));

        // Detectar si hay filtro de fecha activo comparando contra rawData total
        const rawBase = window.rawData && window.rawData.base_excel;
        const totalFechas = rawBase ? new Set(rawBase.map(r => r['FECHA DE INTERACCIÓN']).filter(Boolean)) : fechasActivas;
        const hayFiltroFecha = rawBase && fechasActivas.size < totalFechas.size;

        // Filtrar kpis por las dimensiones activas
        kpisToUse = rawKpis.filter(k => {
            if (bposActivos.size    && !bposActivos.has(k.BPO))       return false;
            if (canalesActivos.size && !canalesActivos.has(k.CANAL))  return false;
            if (skillsActivos.size  && !skillsActivos.has(k.SKILL))   return false;
            // Filtrar por fecha usando FECHA_REAL (mismo formato que FECHA DE INTERACCIÓN)
            if (hayFiltroFecha && k.FECHA_REAL && !fechasActivas.has(k.FECHA_REAL)) return false;
            return true;
        });

        // Recalcular AVG_QA_SCORE en kpis desde base_excel filtrado (más preciso)
        // Agrupar base por FECHA+BPO+CANAL+SKILL para sobreescribir AVG_QA_SCORE
        const qaMap = {};
        base.forEach(r => {
            const key = `${r.BPO}|${r.DATA_CANAL}|${r.DATA_SKILL}|${r.MES}`;
            if (!qaMap[key]) qaMap[key] = [];
            const score = parseFloat(r['QA SCORE']);
            if (!isNaN(score)) qaMap[key].push(score);
        });

        kpisToUse = kpisToUse.map(k => {
            const key = `${k.BPO}|${k.CANAL}|${k.SKILL}|${k.MES}`;
            if (qaMap[key] && qaMap[key].length) {
                const avg = qaMap[key].reduce((a,b)=>a+b,0) / qaMap[key].length;
                return { ...k, AVG_QA_SCORE: +avg.toFixed(4) };
            }
            return k;
        });

    } else {
        // Sin base_excel o base vacía → usar kpis sin filtro
        kpisToUse = rawKpis;
    }

    globalData = { ...data, kpis: kpisToUse };
    renderScorecard(globalData);
}

function getKey(r, gran) {
    if (gran === 'dia') return r.FECHA;
    if (gran === 'semana') return r.SEMANA;
    return r.MES;
}

function agrupar(records, gran) {
    const map = {};
    records.forEach(r => {
        const k = getKey(r, gran);
        if (!map[k]) map[k] = [];
        map[k].push(r);
    });
    return map;
}

function promedio(arr, field) {
    const vals = arr.map(r => parseFloat(r[field])).filter(v => !isNaN(v) && v > 0);
    if (!vals.length) return 0;
    return vals.reduce((a,b) => a+b, 0) / vals.length;
}

function suma(arr, field) {
    return arr.reduce((s, r) => s + (parseFloat(r[field]) || 0), 0);
}

function destroyChart(ref) {
    if (ref) { try { ref.destroy(); } catch(e){} }
    return null;
}

function renderScorecard(data) {
    const kpis = data.kpis;
    const kn = kpis.filter(r => r.BPO === 'KN');
    const at = kpis.filter(r => r.BPO === 'AT');

    // Build grouped timeseries for all, KN, AT
    function buildSeries(records, gran) {
        const map = agrupar(records, gran);
        const keys = Object.keys(map).sort();
        return { keys, map };
    }

    const allSeries = buildSeries(kpis, granularidad);
    const knSeries  = buildSeries(kn, granularidad);
    const atSeries  = buildSeries(at, granularidad);

    // Get all keys sorted (union)
    const allKeys = [...new Set([...allSeries.keys])].sort();
    const knKeys  = [...new Set([...knSeries.keys])].sort();
    const atKeys  = [...new Set([...atSeries.keys])].sort();

    // Helper: format label
    function label(k) {
        if (granularidad === 'dia') return k.slice(5); // MM-DD
        if (granularidad === 'semana') return 'S' + k;
        return k;
    }

    // ---- Consolidated keys (all)
    const consolidadoKeys = allKeys;

    // Build chart datasets
    // Volume: suma
    const volConsolidado = consolidadoKeys.map(k => suma(allSeries.map[k] || [], 'VOL LLAMADAS'));
    const volKN = consolidadoKeys.map(k => suma(agrupar(kn, granularidad)[k] || [], 'VOL LLAMADAS'));
    const volAT = consolidadoKeys.map(k => suma(agrupar(at, granularidad)[k] || [], 'VOL LLAMADAS'));

    // AHT: promedio
    const ahtConsolidado = consolidadoKeys.map(k => promedio(allSeries.map[k] || [], 'AHT'));
    const ahtKN = consolidadoKeys.map(k => promedio(agrupar(kn, granularidad)[k] || [], 'AHT'));
    const ahtAT = consolidadoKeys.map(k => promedio(agrupar(at, granularidad)[k] || [], 'AHT'));

    // NS: promedio
    const nsConsolidado = consolidadoKeys.map(k => promedio(allSeries.map[k] || [], 'NS'));
    const nsKN = consolidadoKeys.map(k => promedio(agrupar(kn, granularidad)[k] || [], 'NS'));
    const nsAT = consolidadoKeys.map(k => promedio(agrupar(at, granularidad)[k] || [], 'NS'));

    const labels = consolidadoKeys.map(label);

    // QA Score series — consolidado y por BPO
    const qaConsolidado = consolidadoKeys.map(k => { const v = promedio(allSeries.map[k] || [], 'AVG_QA_SCORE'); return v > 0 ? +v.toFixed(2) : null; });
    const qaKN = consolidadoKeys.map(k => { const v = promedio(agrupar(kn, granularidad)[k] || [], 'AVG_QA_SCORE'); return v > 0 ? +v.toFixed(2) : null; });
    const qaAT = consolidadoKeys.map(k => { const v = promedio(agrupar(at, granularidad)[k] || [], 'AVG_QA_SCORE'); return v > 0 ? +v.toFixed(2) : null; });

    // QA Score series — por Canal y Skill
    const qaCanalSeries = ['VOZ','DIGITAL'].map(val => {
        const filtered = kpis.filter(r => r.CANAL === val);
        const grouped = agrupar(filtered, granularidad);
        return consolidadoKeys.map(k => { const v = promedio(grouped[k] || [], 'AVG_QA_SCORE'); return v > 0 ? +v.toFixed(2) : null; });
    });
    const qaSkillSeries = ['CARE','TECH'].map(val => {
        const filtered = kpis.filter(r => r.SKILL === val);
        const grouped = agrupar(filtered, granularidad);
        return consolidadoKeys.map(k => { const v = promedio(grouped[k] || [], 'AVG_QA_SCORE'); return v > 0 ? +v.toFixed(2) : null; });
    });

    // Shared QA dataset factory (right Y axis)
    function qaDataset(label, data, color) {
        return {
            label,
            data,
            borderColor: color,
            backgroundColor: 'transparent',
            borderWidth: 1.5,
            borderDash: [5, 3],
            pointRadius: 2,
            fill: false,
            tension: 0.3,
            spanGaps: true,
            yAxisID: 'yQA'
        };
    }

    // Dual-axis options factory
    function dualOpts(yLeftLabel, yLeftTickFn, tooltipFn) {
        return {
            responsive: true,
            maintainAspectRatio: true,
            interaction: { mode: 'index', intersect: false },
            plugins: {
                legend: { position: 'bottom', labels: { usePointStyle: true, font: { size: 11 } } },
                tooltip: tooltipFn ? { callbacks: { label: tooltipFn } } : {}
            },
            scales: {
                x: { ticks: { font: { size: 10 }, maxTicksLimit: 20, maxRotation: 45 } },
                y: {
                    position: 'left',
                    title: { display: true, text: yLeftLabel, font: { size: 11 } },
                    ticks: yLeftTickFn ? { callback: yLeftTickFn } : {}
                },
                yQA: {
                    position: 'right',
                    title: { display: true, text: 'QA Score (%)', font: { size: 11 }, color: '#7c3aed' },
                    ticks: { callback: v => v + '%', color: '#7c3aed' },
                    grid: { drawOnChartArea: false }
                }
            }
        };
    }

    // Scatter AHT vs QA by day
    function buildScatterData(records, color) {
        const grouped = agrupar(records, granularidad);
        return {
            data: Object.keys(grouped).sort().map(k => ({
                x: +(promedio(grouped[k], 'AHT') / 60).toFixed(2),
                y: +promedio(grouped[k], 'AVG_QA_SCORE').toFixed(2)
            })).filter(p => p.x > 0 && p.y > 0),
            backgroundColor: color,
            pointRadius: 6,
            pointHoverRadius: 9
        };
    }

    // Render HTML structure
    document.getElementById('contenidoPrincipal').innerHTML = `
        <div class="section-title">📞 Volumen de Llamadas Histórico</div>
        <div class="charts-row">
            <div class="chart-box full">
                <div class="chart-box-title">Volumen de Llamadas — Consolidado y por BPO</div>
                <canvas id="chartVol"></canvas>
            </div>
        </div>

        <div class="section-title">⏱ AHT Histórico</div>
        <div class="charts-row">
            <div class="chart-box full">
                <div class="chart-box-title">AHT (minutos) — Consolidado y por BPO</div>
                <canvas id="chartAHT"></canvas>
            </div>
        </div>

        <div class="section-title">📶 Nivel de Servicio Histórico</div>
        <div class="charts-row">
            <div class="chart-box full">
                <div class="chart-box-title">NS (%) — Consolidado y por BPO</div>
                <canvas id="chartNS"></canvas>
            </div>
        </div>

        <div class="section-title">📞 Volumen — Por Canal y Skill</div>
        <div class="charts-row">
            <div class="chart-box">
                <div class="chart-box-title">Volumen por Canal (VOZ vs DIGITAL)</div>
                <canvas id="chartVolCanal"></canvas>
            </div>
            <div class="chart-box">
                <div class="chart-box-title">Volumen por Skill (CARE vs TECH)</div>
                <canvas id="chartVolSkill"></canvas>
            </div>
        </div>

        <div class="section-title">⏱ AHT — Por Canal y Skill</div>
        <div class="charts-row">
            <div class="chart-box">
                <div class="chart-box-title">AHT (min) por Canal</div>
                <canvas id="chartAHTCanal"></canvas>
            </div>
            <div class="chart-box">
                <div class="chart-box-title">AHT (min) por Skill</div>
                <canvas id="chartAHTSkill"></canvas>
            </div>
        </div>

        <div class="section-title">📶 NS — Por Canal y Skill</div>
        <div class="charts-row">
            <div class="chart-box">
                <div class="chart-box-title">NS (%) por Canal</div>
                <canvas id="chartNSCanal"></canvas>
            </div>
            <div class="chart-box">
                <div class="chart-box-title">NS (%) por Skill</div>
                <canvas id="chartNSSkill"></canvas>
            </div>
        </div>

        <div class="section-title">🔵 Scatter — AHT vs QA Score</div>
        <div class="charts-row">
            <div class="chart-box full">
                <div class="chart-box-title">Relación AHT (min) vs QA Score — por ${granularidad === 'dia' ? 'Día' : granularidad === 'semana' ? 'Semana' : 'Mes'} y BPO</div>
                <canvas id="chartScatter"></canvas>
            </div>
        </div>

        <div class="section-title">🟢 Scatter — NS vs QA Score</div>
        <div class="charts-row">
            <div class="chart-box full">
                <div class="chart-box-title">Relación Nivel de Servicio (%) vs QA Score — por ${granularidad === 'dia' ? 'Día' : granularidad === 'semana' ? 'Semana' : 'Mes'} y BPO</div>
                <canvas id="chartScatterNS"></canvas>
            </div>
        </div>

        <div class="section-title">🟠 Scatter — Volumen vs QA Score</div>
        <div class="charts-row">
            <div class="chart-box full">
                <div class="chart-box-title">Relación Volumen de Llamadas vs QA Score — por ${granularidad === 'dia' ? 'Día' : granularidad === 'semana' ? 'Semana' : 'Mes'} y BPO</div>
                <canvas id="chartScatterVol"></canvas>
            </div>
        </div>
    `;

    // Common options factory for line charts
    const lineOpts = (yLabel, tickFn) => ({
        responsive: true,
        maintainAspectRatio: true,
        interaction: { mode: 'index', intersect: false },
        plugins: {
            legend: { position: 'bottom', labels: { usePointStyle: true, font: { size: 12 } } }
        },
        scales: {
            x: {
                ticks: {
                    font: { size: 10 },
                    maxTicksLimit: 20,
                    maxRotation: 45
                }
            },
            y: {
                title: { display: true, text: yLabel, font: { size: 11 } },
                ticks: tickFn ? { callback: tickFn } : {}
            }
        }
    });

    // VOLUME chart
    chartVol = destroyChart(chartVol);
    chartVol = new Chart(document.getElementById('chartVol'), {
        type: 'line',
        data: {
            labels,
            datasets: [
                { label: 'Vol Consolidado', data: volConsolidado, borderColor: '#1e293b', backgroundColor: 'rgba(30,41,59,0.08)', borderWidth: 2.5, pointRadius: 2, fill: true, tension: 0.3, yAxisID: 'y' },
                { label: 'Vol KN',          data: volKN,          borderColor: '#1b98e0', backgroundColor: 'transparent', borderWidth: 1.8, pointRadius: 2, fill: false, tension: 0.3, yAxisID: 'y' },
                { label: 'Vol AT',          data: volAT,          borderColor: '#10b981', backgroundColor: 'transparent', borderWidth: 1.8, pointRadius: 2, fill: false, tension: 0.3, yAxisID: 'y' },
                qaDataset('QA Consolidado', qaConsolidado, '#7c3aed'),
                qaDataset('QA KN',          qaKN,          '#a78bfa'),
                qaDataset('QA AT',          qaAT,          '#c4b5fd')
            ]
        },
        options: dualOpts('Llamadas', v => v >= 1000 ? (v/1000).toFixed(1)+'k' : v,
            ctx => ctx.dataset.yAxisID === 'yQA'
                ? `${ctx.dataset.label}: ${ctx.parsed.y?.toFixed(1)}%`
                : `${ctx.dataset.label}: ${(ctx.parsed.y||0).toLocaleString('es-CL')}`)
    });

    // AHT chart (convert seconds to min for display)
    const ahtMinCons = ahtConsolidado.map(v => v > 0 ? +(v/60).toFixed(2) : null);
    const ahtMinKN   = ahtKN.map(v => v > 0 ? +(v/60).toFixed(2) : null);
    const ahtMinAT   = ahtAT.map(v => v > 0 ? +(v/60).toFixed(2) : null);

    chartAHT = destroyChart(chartAHT);
    chartAHT = new Chart(document.getElementById('chartAHT'), {
        type: 'line',
        data: {
            labels,
            datasets: [
                { label: 'AHT Consolidado', data: ahtMinCons, borderColor: '#1e293b', backgroundColor: 'rgba(30,41,59,0.08)', borderWidth: 2.5, pointRadius: 2, fill: true, tension: 0.3, spanGaps: true, yAxisID: 'y' },
                { label: 'AHT KN',          data: ahtMinKN,   borderColor: '#1b98e0', backgroundColor: 'transparent', borderWidth: 1.8, pointRadius: 2, fill: false, tension: 0.3, spanGaps: true, yAxisID: 'y' },
                { label: 'AHT AT',          data: ahtMinAT,   borderColor: '#10b981', backgroundColor: 'transparent', borderWidth: 1.8, pointRadius: 2, fill: false, tension: 0.3, spanGaps: true, yAxisID: 'y' },
                qaDataset('QA Consolidado', qaConsolidado, '#7c3aed'),
                qaDataset('QA KN',          qaKN,          '#a78bfa'),
                qaDataset('QA AT',          qaAT,          '#c4b5fd')
            ]
        },
        options: dualOpts('AHT (min)', v => v + ' min',
            ctx => ctx.dataset.yAxisID === 'yQA'
                ? `${ctx.dataset.label}: ${ctx.parsed.y?.toFixed(1)}%`
                : `${ctx.dataset.label}: ${ctx.parsed.y?.toFixed(1)} min`)
    });

    // NS chart
    chartNS = destroyChart(chartNS);
    chartNS = new Chart(document.getElementById('chartNS'), {
        type: 'line',
        data: {
            labels,
            datasets: [
                { label: 'NS Consolidado', data: nsConsolidado.map(v => v > 0 ? +v.toFixed(1) : null), borderColor: '#1e293b', backgroundColor: 'rgba(30,41,59,0.08)', borderWidth: 2.5, pointRadius: 2, fill: true, tension: 0.3, spanGaps: true, yAxisID: 'y' },
                { label: 'NS KN',          data: nsKN.map(v => v > 0 ? +v.toFixed(1) : null),          borderColor: '#1b98e0', backgroundColor: 'transparent', borderWidth: 1.8, pointRadius: 2, fill: false, tension: 0.3, spanGaps: true, yAxisID: 'y' },
                { label: 'NS AT',          data: nsAT.map(v => v > 0 ? +v.toFixed(1) : null),          borderColor: '#10b981', backgroundColor: 'transparent', borderWidth: 1.8, pointRadius: 2, fill: false, tension: 0.3, spanGaps: true, yAxisID: 'y' },
                qaDataset('QA Consolidado', qaConsolidado, '#7c3aed'),
                qaDataset('QA KN',          qaKN,          '#a78bfa'),
                qaDataset('QA AT',          qaAT,          '#c4b5fd')
            ]
        },
        options: dualOpts('NS (%)', v => v + '%',
            ctx => ctx.dataset.yAxisID === 'yQA'
                ? `${ctx.dataset.label}: ${ctx.parsed.y?.toFixed(1)}%`
                : `${ctx.dataset.label}: ${ctx.parsed.y?.toFixed(1)}%`)
    });

    // ---- Canal / Skill breakdowns ----
    const canales = ['VOZ', 'DIGITAL'];
    const skills  = ['CARE', 'TECH'];

    const canalColors = { VOZ: '#2563eb', DIGITAL: '#f59e0b' };
    const skillColors = { CARE: '#8b5cf6', TECH: '#f43f5e' };

    function buildSegmentSeries(records, gran, segField, segValues, metric, aggFn) {
        return segValues.map(val => {
            const filtered = records.filter(r => r[segField] === val);
            const grouped  = agrupar(filtered, gran);
            return consolidadoKeys.map(k => {
                const recs = grouped[k] || [];
                if (!recs.length) return null;
                const v = aggFn(recs, metric);
                return v > 0 ? +v.toFixed(2) : null;
            });
        });
    }

    function makeSegmentChart(canvasId, existingChart, segValues, colors, seriesData, yLabel, tickFn, tooltipFn, qaSeriesData) {
        existingChart = destroyChart(existingChart);
        const datasets = segValues.map((val, i) => ({
            label: val,
            data: seriesData[i],
            borderColor: colors[val],
            backgroundColor: colors[val].replace(')', ', 0.08)').replace('rgb', 'rgba'),
            borderWidth: 2,
            pointRadius: 2,
            fill: false,
            tension: 0.3,
            spanGaps: true,
            yAxisID: 'y'
        }));
        // QA overlay datasets (dashed purple)
        const qaColors = ['#7c3aed', '#a78bfa', '#c4b5fd', '#ddd6fe'];
        if (qaSeriesData) {
            segValues.forEach((val, i) => {
                datasets.push({
                    label: `QA ${val}`,
                    data: qaSeriesData[i],
                    borderColor: qaColors[i] || '#7c3aed',
                    backgroundColor: 'transparent',
                    borderWidth: 1.5,
                    borderDash: [5, 3],
                    pointRadius: 2,
                    fill: false,
                    tension: 0.3,
                    spanGaps: true,
                    yAxisID: 'yQA'
                });
            });
        }
        existingChart = new Chart(document.getElementById(canvasId), {
            type: 'line',
            data: { labels, datasets },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                interaction: { mode: 'index', intersect: false },
                plugins: {
                    legend: { position: 'bottom', labels: { usePointStyle: true, font: { size: 11 } } },
                    tooltip: tooltipFn ? { callbacks: { label: tooltipFn } } : {}
                },
                scales: {
                    x: { ticks: { font: { size: 10 }, maxTicksLimit: 20, maxRotation: 45 } },
                    y: {
                        position: 'left',
                        title: { display: true, text: yLabel, font: { size: 11 } },
                        ticks: tickFn ? { callback: tickFn } : {}
                    },
                    yQA: {
                        position: 'right',
                        title: { display: true, text: 'QA Score (%)', font: { size: 11 }, color: '#7c3aed' },
                        ticks: { callback: v => v + '%', color: '#7c3aed' },
                        grid: { drawOnChartArea: false }
                    }
                }
            }
        });
        return existingChart;
    }

    // Volume by Canal
    const volCanalSeries = buildSegmentSeries(kpis, granularidad, 'CANAL', canales, 'VOL LLAMADAS', suma);
    chartVolCanal = makeSegmentChart('chartVolCanal', chartVolCanal, canales, canalColors, volCanalSeries,
        'Llamadas', v => v >= 1000 ? (v/1000).toFixed(1)+'k' : v,
        ctx => ctx.dataset.yAxisID === 'yQA'
            ? `${ctx.dataset.label}: ${ctx.parsed.y?.toFixed(1)}%`
            : `${ctx.dataset.label}: ${(ctx.parsed.y||0).toLocaleString('es-CL')}`,
        qaCanalSeries);

    // Volume by Skill
    const volSkillSeries = buildSegmentSeries(kpis, granularidad, 'SKILL', skills, 'VOL LLAMADAS', suma);
    chartVolSkill = makeSegmentChart('chartVolSkill', chartVolSkill, skills, skillColors, volSkillSeries,
        'Llamadas', v => v >= 1000 ? (v/1000).toFixed(1)+'k' : v,
        ctx => ctx.dataset.yAxisID === 'yQA'
            ? `${ctx.dataset.label}: ${ctx.parsed.y?.toFixed(1)}%`
            : `${ctx.dataset.label}: ${(ctx.parsed.y||0).toLocaleString('es-CL')}`,
        qaSkillSeries);

    // AHT by Canal (convert to min)
    const ahtCanalSeries = buildSegmentSeries(kpis, granularidad, 'CANAL', canales, 'AHT', promedio)
        .map(arr => arr.map(v => v ? +(v/60).toFixed(2) : null));
    chartAHTCanal = makeSegmentChart('chartAHTCanal', chartAHTCanal, canales, canalColors, ahtCanalSeries,
        'AHT (min)', v => v + ' min',
        ctx => ctx.dataset.yAxisID === 'yQA'
            ? `${ctx.dataset.label}: ${ctx.parsed.y?.toFixed(1)}%`
            : `${ctx.dataset.label}: ${ctx.parsed.y?.toFixed(1)} min`,
        qaCanalSeries);

    // AHT by Skill
    const ahtSkillSeries = buildSegmentSeries(kpis, granularidad, 'SKILL', skills, 'AHT', promedio)
        .map(arr => arr.map(v => v ? +(v/60).toFixed(2) : null));
    chartAHTSkill = makeSegmentChart('chartAHTSkill', chartAHTSkill, skills, skillColors, ahtSkillSeries,
        'AHT (min)', v => v + ' min',
        ctx => ctx.dataset.yAxisID === 'yQA'
            ? `${ctx.dataset.label}: ${ctx.parsed.y?.toFixed(1)}%`
            : `${ctx.dataset.label}: ${ctx.parsed.y?.toFixed(1)} min`,
        qaSkillSeries);

    // NS by Canal
    const nsCanalSeries = buildSegmentSeries(kpis, granularidad, 'CANAL', canales, 'NS', promedio);
    chartNSCanal = makeSegmentChart('chartNSCanal', chartNSCanal, canales, canalColors, nsCanalSeries,
        'NS (%)', v => v + '%',
        ctx => `${ctx.dataset.label}: ${ctx.parsed.y?.toFixed(1)}%`,
        qaCanalSeries);

    // NS by Skill
    const nsSkillSeries = buildSegmentSeries(kpis, granularidad, 'SKILL', skills, 'NS', promedio);
    chartNSSkill = makeSegmentChart('chartNSSkill', chartNSSkill, skills, skillColors, nsSkillSeries,
        'NS (%)', v => v + '%',
        ctx => `${ctx.dataset.label}: ${ctx.parsed.y?.toFixed(1)}%`,
        qaSkillSeries);

    // ── Quadrant plugin (local per-chart, crosshair at data mean) ────────────
    function makeQuadrantPlugin(quadrants, meanX, meanY) {
        return {
            id: 'quadrants_' + Math.random().toString(36).slice(2),
            beforeDraw(chart) {
                const { ctx, chartArea: a, scales: { x, y } } = chart;
                if (!a) return;
                const pxMidX = x.getPixelForValue(meanX);
                const pxMidY = y.getPixelForValue(meanY);

                ctx.save();

                // 1. Background fills
                quadrants.forEach(q => {
                    const x0 = q.xHigh ? pxMidX : a.left;
                    const x1 = q.xHigh ? a.right : pxMidX;
                    const y0 = q.yHigh ? a.top   : pxMidY;
                    const y1 = q.yHigh ? pxMidY  : a.bottom;
                    ctx.fillStyle = q.bg;
                    ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
                });

                // 2. Crosshair lines
                ctx.strokeStyle = 'rgba(100,116,139,0.4)';
                ctx.lineWidth = 1.5;
                ctx.setLineDash([6, 4]);
                ctx.beginPath(); ctx.moveTo(pxMidX, a.top);  ctx.lineTo(pxMidX, a.bottom); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(a.left, pxMidY); ctx.lineTo(a.right, pxMidY);  ctx.stroke();
                ctx.setLineDash([]);

                // 3. Labels with pill background
                quadrants.forEach(q => {
                    const x0 = q.xHigh ? pxMidX : a.left;
                    const x1 = q.xHigh ? a.right : pxMidX;
                    const y0 = q.yHigh ? a.top   : pxMidY;
                    const y1 = q.yHigh ? pxMidY  : a.bottom;

                    const PAD_X = 7, PAD_Y = 4, LINE_H = 15, RADIUS = 6;

                    // Measure text widths
                    ctx.font = 'bold 11px Segoe UI,sans-serif';
                    const w0 = ctx.measureText(q.lines[0]).width;
                    ctx.font = '10px Segoe UI,sans-serif';
                    const w1 = ctx.measureText(q.lines[1]).width;
                    const boxW = Math.max(w0, w1) + PAD_X * 2;
                    const boxH = LINE_H * 2 + PAD_Y * 2;

                    // Position: hug the corner with 10px margin
                    const MARGIN = 10;
                    const bx = q.xHigh ? x1 - boxW - MARGIN : x0 + MARGIN;
                    const by = q.yHigh ? y0 + MARGIN        : y1 - boxH - MARGIN;

                    // Pill background
                    ctx.beginPath();
                    ctx.moveTo(bx + RADIUS, by);
                    ctx.lineTo(bx + boxW - RADIUS, by);
                    ctx.quadraticCurveTo(bx + boxW, by, bx + boxW, by + RADIUS);
                    ctx.lineTo(bx + boxW, by + boxH - RADIUS);
                    ctx.quadraticCurveTo(bx + boxW, by + boxH, bx + boxW - RADIUS, by + boxH);
                    ctx.lineTo(bx + RADIUS, by + boxH);
                    ctx.quadraticCurveTo(bx, by + boxH, bx, by + boxH - RADIUS);
                    ctx.lineTo(bx, by + RADIUS);
                    ctx.quadraticCurveTo(bx, by, bx + RADIUS, by);
                    ctx.closePath();
                    ctx.fillStyle = q.pillBg;
                    ctx.fill();
                    ctx.strokeStyle = q.pillBorder;
                    ctx.lineWidth = 1;
                    ctx.stroke();

                    // Text
                    const tx = bx + PAD_X;
                    ctx.textAlign = 'left';
                    ctx.textBaseline = 'top';

                    ctx.font = 'bold 11px Segoe UI,sans-serif';
                    ctx.fillStyle = q.textBold;
                    ctx.fillText(q.lines[0], tx, by + PAD_Y);

                    ctx.font = '10px Segoe UI,sans-serif';
                    ctx.fillStyle = q.textSub;
                    ctx.fillText(q.lines[1], tx, by + PAD_Y + LINE_H);
                });

                ctx.restore();
            }
        };
    }

    // Helper: mean of array
    function mean(arr) { return arr.length ? arr.reduce((a,b)=>a+b,0)/arr.length : 0; }

    // ── Quadrant definitions — 4 distinct colors per chart ──────────────────
    // Colors: green(ideal) | yellow(vigilar) | orange(revisar) | red(critico)
    const quadrantsAHT = [
        // ↖ AHT bajo · QA alto = IDEAL
        { xHigh: false, yHigh: true,
          bg: 'rgba(16,185,129,0.10)', pillBg: 'rgba(16,185,129,0.85)',  pillBorder: '#059669',
          textBold: '#fff', textSub: 'rgba(255,255,255,0.85)',
          lines: ['✅ Situación ideal', 'AHT bajo · QA alto'] },
        // ↗ AHT alto · QA alto = VIGILAR
        { xHigh: true,  yHigh: true,
          bg: 'rgba(245,158,11,0.10)', pillBg: 'rgba(245,158,11,0.90)',  pillBorder: '#d97706',
          textBold: '#fff', textSub: 'rgba(255,255,255,0.85)',
          lines: ['⚠️ Vigilar', 'AHT alto · QA alto'] },
        // ↙ AHT bajo · QA bajo = REVISAR
        { xHigh: false, yHigh: false,
          bg: 'rgba(249,115,22,0.10)', pillBg: 'rgba(249,115,22,0.88)', pillBorder: '#ea580c',
          textBold: '#fff', textSub: 'rgba(255,255,255,0.85)',
          lines: ['🔶 Revisar calidad', 'AHT bajo · QA bajo'] },
        // ↘ AHT alto · QA bajo = CRITICO
        { xHigh: true,  yHigh: false,
          bg: 'rgba(239,68,68,0.10)',  pillBg: 'rgba(239,68,68,0.88)',  pillBorder: '#dc2626',
          textBold: '#fff', textSub: 'rgba(255,255,255,0.85)',
          lines: ['🚨 Problema doble', 'AHT alto · QA bajo'] },
    ];

    const quadrantsNS = [
        // ↗ NS alto · QA alto = IDEAL
        { xHigh: true,  yHigh: true,
          bg: 'rgba(16,185,129,0.10)', pillBg: 'rgba(16,185,129,0.85)',  pillBorder: '#059669',
          textBold: '#fff', textSub: 'rgba(255,255,255,0.85)',
          lines: ['✅ Operación sana', 'NS alto · QA alto'] },
        // ↖ NS bajo · QA alto = REVISAR DOTACIÓN
        { xHigh: false, yHigh: true,
          bg: 'rgba(245,158,11,0.10)', pillBg: 'rgba(245,158,11,0.90)',  pillBorder: '#d97706',
          textBold: '#fff', textSub: 'rgba(255,255,255,0.85)',
          lines: ['⚠️ Revisar dotación', 'NS bajo · QA alto'] },
        // ↘ NS alto · QA bajo = VIGILAR
        { xHigh: true,  yHigh: false,
          bg: 'rgba(249,115,22,0.10)', pillBg: 'rgba(249,115,22,0.88)', pillBorder: '#ea580c',
          textBold: '#fff', textSub: 'rgba(255,255,255,0.85)',
          lines: ['🔶 Vigilar calidad', 'NS alto · QA bajo'] },
        // ↙ NS bajo · QA bajo = CRISIS
        { xHigh: false, yHigh: false,
          bg: 'rgba(239,68,68,0.10)',  pillBg: 'rgba(239,68,68,0.88)',  pillBorder: '#dc2626',
          textBold: '#fff', textSub: 'rgba(255,255,255,0.85)',
          lines: ['🚨 Crisis operativa', 'NS bajo · QA bajo'] },
    ];

    const quadrantsVol = [
        // ↗ Vol alto · QA alto = IDEAL
        { xHigh: true,  yHigh: true,
          bg: 'rgba(16,185,129,0.10)', pillBg: 'rgba(16,185,129,0.85)',  pillBorder: '#059669',
          textBold: '#fff', textSub: 'rgba(255,255,255,0.85)',
          lines: ['✅ Madurez operativa', 'Vol alto · QA alto'] },
        // ↖ Vol bajo · QA alto = CAPACIDAD OCIOSA
        { xHigh: false, yHigh: true,
          bg: 'rgba(245,158,11,0.10)', pillBg: 'rgba(245,158,11,0.90)',  pillBorder: '#d97706',
          textBold: '#fff', textSub: 'rgba(255,255,255,0.85)',
          lines: ['⚠️ Capacidad ociosa', 'Vol bajo · QA alto'] },
        // ↘ Vol alto · QA bajo = FATIGA
        { xHigh: true,  yHigh: false,
          bg: 'rgba(249,115,22,0.10)', pillBg: 'rgba(249,115,22,0.88)', pillBorder: '#ea580c',
          textBold: '#fff', textSub: 'rgba(255,255,255,0.85)',
          lines: ['🔶 Fatiga / presión', 'Vol alto · QA bajo'] },
        // ↙ Vol bajo · QA bajo = CRITICO
        { xHigh: false, yHigh: false,
          bg: 'rgba(239,68,68,0.10)',  pillBg: 'rgba(239,68,68,0.88)',  pillBorder: '#dc2626',
          textBold: '#fff', textSub: 'rgba(255,255,255,0.85)',
          lines: ['🚨 Crítico', 'Vol bajo · QA bajo'] },
    ];

    function scatterOpts(xLabel, xTickFn, tooltipFn) {
        return {
            responsive: true, maintainAspectRatio: true,
            plugins: {
                legend: { position: 'bottom', labels: { usePointStyle: true, font: { size: 12 } } },
                tooltip: { callbacks: { label: tooltipFn } }
            },
            scales: {
                x: { title: { display: true, text: xLabel }, ticks: xTickFn ? { callback: xTickFn } : {} },
                y: { title: { display: true, text: 'QA Score (%)' }, ticks: { callback: v => v + '%' } }
            }
        };
    }

    // Scatter AHT vs QA
    chartScatter = destroyChart(chartScatter);
    const scatterKN = buildScatterData(kn, 'rgba(27,152,224,0.85)');
    const scatterAT = buildScatterData(at, 'rgba(16,185,129,0.85)');
    const allPtsAHT = [...scatterKN.data, ...scatterAT.data];
    const quadPluginAHT = makeQuadrantPlugin(quadrantsAHT, mean(allPtsAHT.map(p=>p.x)), mean(allPtsAHT.map(p=>p.y)));
    chartScatter = new Chart(document.getElementById('chartScatter'), {
        type: 'scatter',
        data: { datasets: [{ label: 'KN', ...scatterKN }, { label: 'AT', ...scatterAT }] },
        options: scatterOpts('AHT (minutos)', v => v + ' min', ctx => `${ctx.dataset.label} — AHT: ${ctx.raw.x} min | QA: ${ctx.raw.y}%`),
        plugins: [quadPluginAHT]
    });

    // Scatter NS vs QA
    function buildScatterNS(records, color) {
        const grouped = agrupar(records, granularidad);
        return {
            data: Object.keys(grouped).sort().map(k => ({
                x: +promedio(grouped[k], 'NS').toFixed(2),
                y: +promedio(grouped[k], 'AVG_QA_SCORE').toFixed(2)
            })).filter(p => p.x > 0 && p.y > 0),
            backgroundColor: color, pointRadius: 6, pointHoverRadius: 9
        };
    }
    function buildScatterVol(records, color) {
        const grouped = agrupar(records, granularidad);
        return {
            data: Object.keys(grouped).sort().map(k => ({
                x: +suma(grouped[k], 'VOL LLAMADAS').toFixed(0),
                y: +promedio(grouped[k], 'AVG_QA_SCORE').toFixed(2)
            })).filter(p => p.x > 0 && p.y > 0),
            backgroundColor: color, pointRadius: 6, pointHoverRadius: 9
        };
    }

    chartScatterNS = destroyChart(chartScatterNS);
    const nsKNd = buildScatterNS(kn, 'rgba(27,152,224,0.85)');
    const nsATd = buildScatterNS(at, 'rgba(16,185,129,0.85)');
    const allPtsNS = [...nsKNd.data, ...nsATd.data];
    const quadPluginNS = makeQuadrantPlugin(quadrantsNS, mean(allPtsNS.map(p=>p.x)), mean(allPtsNS.map(p=>p.y)));
    chartScatterNS = new Chart(document.getElementById('chartScatterNS'), {
        type: 'scatter',
        data: { datasets: [{ label: 'KN', ...nsKNd }, { label: 'AT', ...nsATd }] },
        options: scatterOpts('Nivel de Servicio (%)', v => v + '%', ctx => `${ctx.dataset.label} — NS: ${ctx.raw.x}% | QA: ${ctx.raw.y}%`),
        plugins: [quadPluginNS]
    });

    chartScatterVol = destroyChart(chartScatterVol);
    const volKNd = buildScatterVol(kn, 'rgba(27,152,224,0.85)');
    const volATd = buildScatterVol(at, 'rgba(245,158,11,0.85)');
    const allPtsVol = [...volKNd.data, ...volATd.data];
    const quadPluginVol = makeQuadrantPlugin(quadrantsVol, mean(allPtsVol.map(p=>p.x)), mean(allPtsVol.map(p=>p.y)));
    chartScatterVol = new Chart(document.getElementById('chartScatterVol'), {
        type: 'scatter',
        data: { datasets: [{ label: 'KN', ...volKNd }, { label: 'AT', ...volATd }] },
        options: scatterOpts('Volumen de Llamadas', v => v >= 1000 ? (v/1000).toFixed(1)+'k' : v, ctx => `${ctx.dataset.label} — Vol: ${ctx.raw.x.toLocaleString('es-CL')} | QA: ${ctx.raw.y}%`),
        plugins: [quadPluginVol]
    });

    setTimeout(notifyHeight, 100);
    setTimeout(notifyHeight, 800);
    setTimeout(notifyHeight, 1500);
}
</script>
