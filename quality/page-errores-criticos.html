<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Errores Críticos y Fatales</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* ── Estilos específicos de esta subpágina ── */
        .kpi-grid-errores {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }
        .kpi-card-err {
            border-radius: 12px;
            padding: 20px 18px;
            color: #fff;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 14px rgba(0,0,0,.08);
            transition: transform .2s, box-shadow .2s;
        }
        .kpi-card-err:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(0,0,0,.13); }
        .kpi-card-err .kpi-icon { font-size: 28px; margin-bottom: 8px; }
        .kpi-card-err .kpi-label { font-size: 12px; opacity: .85; text-transform: uppercase; letter-spacing: .5px; margin-bottom: 4px; }
        .kpi-card-err .kpi-value { font-size: 32px; font-weight: 700; line-height: 1.1; }
        .kpi-card-err .kpi-sub { font-size: 12px; opacity: .75; margin-top: 6px; }

        /* Gradientes KPI */
        .kpi-fatal   { background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%); }
        .kpi-warning { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); }
        .kpi-orange  { background: linear-gradient(135deg, #f97316 0%, #c2410c 100%); }
        .kpi-blue    { background: linear-gradient(135deg, #1b98e0 0%, #1d4ed8 100%); }
        .kpi-slate   { background: linear-gradient(135deg, #64748b 0%, #334155 100%); }

        /* Sección con tarjeta */
        .section-card {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 28px;
            box-shadow: 0 2px 10px rgba(0,0,0,.06);
        }
        .section-card h3 {
            margin: 0 0 18px 0;
            font-size: 16px;
            font-weight: 600;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .section-subtitle {
            font-size: 12px;
            color: #94a3b8;
            font-weight: 400;
            margin-left: 8px;
        }

        /* Tablas */
        .err-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 13px;
        }
        .err-table thead th {
            background: #f1f5f9;
            color: #475569;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: .4px;
            padding: 12px 14px;
            text-align: left;
            border-bottom: 2px solid #e2e8f0;
            position: sticky;
            top: 0;
            white-space: nowrap;
            z-index: 2;
        }
        .err-table thead th:first-child { border-radius: 8px 0 0 0; }
        .err-table thead th:last-child  { border-radius: 0 8px 0 0; }
        .err-table tbody tr { transition: background .15s; }
        .err-table tbody tr:nth-child(even) { background: #f8fafc; }
        .err-table tbody tr:hover { background: #eef2ff; }
        .err-table tbody td {
            padding: 11px 14px;
            color: #334155;
            border-bottom: 1px solid #f1f5f9;
            white-space: nowrap;
        }
        .err-table tbody td.num { text-align: center; font-variant-numeric: tabular-nums; }

        /* Sticky columns para tablas de evolución */
        .err-table .sticky-col {
            position: sticky;
            z-index: 1;
        }
        .err-table thead .sticky-col { z-index: 3; }
        .err-table .sticky-col-1 { left: 0; min-width: 180px; max-width: 200px; }
        .err-table .sticky-col-2 { left: 180px; min-width: 150px; max-width: 170px; }
        .err-table tbody tr:nth-child(even) .sticky-col { background: #f8fafc; }
        .err-table tbody tr:nth-child(odd) .sticky-col  { background: #fff; }
        .err-table tbody tr:hover .sticky-col { background: #eef2ff; }
        .err-table thead .sticky-col { background: #f1f5f9; }

        /* Heatmap cells */
        .heat-cell {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 32px;
            padding: 0 6px;
            height: 28px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }
        .heat-ok    { background: #d1fae5; color: #065f46; }
        .heat-warn  { background: #fef3c7; color: #92400e; }
        .heat-bad   { background: #fee2e2; color: #991b1b; }
        .heat-empty { background: #f1f5f9; color: #cbd5e1; }

        /* Semáforo */
        .sem { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .sem-green  { background: #d1fae5; color: #065f46; }
        .sem-yellow { background: #fef3c7; color: #92400e; }
        .sem-red    { background: #fee2e2; color: #991b1b; }

        /* Badge BPO */
        .bpo-badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; letter-spacing: .3px; }
        .bpo-kn { background: #dbeafe; color: #1e40af; }
        .bpo-at { background: #fce7f3; color: #9d174d; }
        .bpo-equal { background: #f1f5f9; color: #64748b; }

        /* Worst highlight */
        .worst-cell { background: #fef2f2 !important; }

        /* Grid dos columnas para gráficos */
        .charts-duo {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 28px;
        }
        @media (max-width: 900px) {
            .charts-duo { grid-template-columns: 1fr; }
            .kpi-grid-errores { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
        }

        .chart-wrap { position: relative; width: 100%; }
        .chart-wrap canvas { width: 100% !important; }

        .no-data-msg {
            text-align: center;
            padding: 48px 20px;
            color: #94a3b8;
            font-size: 15px;
        }

        /* Scroll horizontal para tablas anchas */
        .table-scroll {
            overflow-x: auto;
            max-height: 520px;
            overflow-y: auto;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        /* Legend inline */
        .legend-inline {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-top: 12px;
            font-size: 12px;
            color: #64748b;
        }
        .legend-inline span {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .legend-dot {
            width: 12px;
            height: 12px;
            border-radius: 4px;
            display: inline-block;
        }

        /* ── Text Mining ── */
        .tm-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 24px;
        }
        @media (max-width: 900px) { .tm-grid { grid-template-columns: 1fr; } }

        .tm-phrase-list { list-style: none; padding: 0; margin: 0; }
        .tm-phrase-list li {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-bottom: 1px solid #f1f5f9;
            font-size: 13px;
            transition: background .15s;
        }
        .tm-phrase-list li:hover { background: #f8fafc; }
        .tm-phrase-list li:last-child { border-bottom: none; }
        .tm-rank {
            min-width: 24px; height: 24px;
            border-radius: 50%; background: #e2e8f0; color: #475569;
            font-size: 11px; font-weight: 700;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .tm-phrase-text { flex: 1; color: #334155; }
        .tm-phrase-count {
            font-weight: 700; font-variant-numeric: tabular-nums;
            color: #1e293b; min-width: 32px; text-align: right;
        }
        .tm-bar-bg {
            width: 80px; height: 8px; background: #f1f5f9;
            border-radius: 4px; overflow: hidden; flex-shrink: 0;
        }
        .tm-bar-fill { height: 100%; border-radius: 4px; transition: width .3s; }

        .tm-tabs {
            display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;
        }
        .tm-tab {
            padding: 6px 16px; border-radius: 20px; border: 1px solid #e2e8f0;
            background: #fff; cursor: pointer; font-size: 12px; font-weight: 600;
            color: #64748b; transition: all .2s;
        }
        .tm-tab:hover { border-color: #94a3b8; color: #334155; }
        .tm-tab.active { background: #1e293b; color: #fff; border-color: #1e293b; }

        .tm-panel { display: none; }
        .tm-panel.active { display: block; }

        .tm-bpo-compare {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 700px) { .tm-bpo-compare { grid-template-columns: 1fr; } }
        .tm-bpo-col h4 {
            font-size: 13px; font-weight: 600; margin: 0 0 10px 0;
            display: flex; align-items: center; gap: 6px;
        }
    </style>
</head>
<body style="background: transparent; padding: 0;">
    <div style="padding: 0;">
        <h2 style="margin-bottom: 24px; color: var(--text-primary, #1e293b);">
            🚨 Errores Críticos y Fatales
        </h2>

        <div id="contenidoPrincipal">
            <div class="loading">Cargando datos...</div>
        </div>
    </div>

    <script>
    /* ================================================================
       COMUNICACIÓN CON EL PADRE (PATRÓN OBLIGATORIO)
       ================================================================ */
    function notifyHeight() {
        var height = document.body.scrollHeight;
        window.parent.postMessage({ type: 'RESIZE', height: height }, '*');
    }

    /* ================================================================
       CONSTANTES Y UTILIDADES
       ================================================================ */
    var chartInstances = [];
    function destroyCharts() {
        chartInstances.forEach(function(c) { c.destroy(); });
        chartInstances = [];
    }

    /*  Criterios críticos: Q11, Q12, Q13, Q21
        Evaluación binaria: 1 = cumple, 0 = no cumple (error)       */
    var ERRORES_CONFIG = [
        { key: 'Q11', label: 'Solución',    tipo: 'fatal', icon: '🔧', color: '#ef4444' },
        { key: 'Q12', label: 'Recontacto',  tipo: 'fatal', icon: '🔄', color: '#f59e0b' },
        { key: 'Q13', label: 'Escalamiento', tipo: 'fatal', icon: '✅', color: '#f97316' },
        { key: 'Q21', label: 'Transferencia',    tipo: 'fatal', icon: '📝', color: '#8b5cf6' }
    ];

    var Q_KEYS = ERRORES_CONFIG.map(function(e) { return e.key; });

    function val(r, f) { return parseFloat(r[f]) || 0; }
    function pct(n, d) { return d === 0 ? 0 : (n / d * 100); }
    function fmtPct(v)  { return v.toFixed(1) + '%'; }

    function semaforo(porcentaje) {
        if (porcentaje < 5)   return '<span class="sem sem-green">'  + fmtPct(porcentaje) + '</span>';
        if (porcentaje <= 10) return '<span class="sem sem-yellow">' + fmtPct(porcentaje) + '</span>';
        return '<span class="sem sem-red">' + fmtPct(porcentaje) + '</span>';
    }

    function bpoBadge(bpo) {
        if (bpo === 'KN') return '<span class="bpo-badge bpo-kn">KN</span>';
        if (bpo === 'AT') return '<span class="bpo-badge bpo-at">AT</span>';
        return '<span class="bpo-badge bpo-equal">—</span>';
    }

    /** Error = valor es 0 (o vacío) */
    function tieneError(r, cfg) { return val(r, cfg.key) === 0; }

    /** ¿Tiene al menos 1 error crítico? */
    function tieneAlgunError(r) {
        return ERRORES_CONFIG.some(function(cfg) { return tieneError(r, cfg); });
    }

    function semanaNum(s) { return parseInt(String(s).replace(/\D/g, '')) || 0; }

    /** Heatmap cell */
    function heatCell(errores, total) {
        if (total === 0) return '<span class="heat-cell heat-empty">—</span>';
        if (errores === 0) return '<span class="heat-cell heat-ok">0</span>';
        if (errores === 1) return '<span class="heat-cell heat-warn">1</span>';
        return '<span class="heat-cell heat-bad">' + errores + '</span>';
    }

    function truncar(txt, max) {
        if (!txt) return '';
        return txt.length > max ? txt.substring(0, max - 1) + '…' : txt;
    }

    /* ================================================================
       TEXT MINING — UTILIDADES
       ================================================================ */
    var STOPWORDS = new Set([
        'de','la','el','en','que','y','a','los','del','las','se','un','una','por','con','no','es',
        'lo','para','al','como','su','más','pero','sus','le','ya','fue','este','ha','sí','si',
        'sin','sobre','también','me','hasta','hay','donde','quien','desde','todo','nos','durante',
        'todos','uno','les','ni','contra','otros','ese','eso','ante','ellos','e','esto','mí','antes',
        'algunos','qué','unos','yo','otro','otras','otra','él','tanto','esa','estos','mucho','quién',
        'nada','muchos','cual','poco','ella','entre','poder','ser','tiene','le','sido','era','muy',
        'tiene','tiene','puede','está','están','ser','hay','hace','hacer','hizo','hecho','fue','ser',
        'el','la','los','las','un','una','unos','unas','al','del','lo','le','les','se','nos',
        'te','ti','tu','tú','mi','mí','me','él','ella','ello','nosotros','ellos','ellas',
        'este','esta','estos','estas','ese','esa','esos','esas','aquel','aquella','aquellos','aquellas',
        'que','cual','cuales','quien','quienes','cuanto','cuanta','cuantos','cuantas',
        'donde','como','cuando','cuanto','porque','pues','sino','aunque','mientras',
        'aquí','ahí','allí','así','bien','después','entonces','luego','más','menos','nunca',
        'siempre','solo','sólo','ya','aún','aun','también','tampoco','casi','quizá','quizás',
        'algo','alguien','alguno','alguna','algunos','algunas','ningún','ninguno','ninguna',
        'cada','demás','mismo','misma','mismos','mismas','propio','propia','todo','toda','todos','todas',
        'da','dan','dio','dió','al','del','etc','sr','sra','dr','dra','cia','ltda','sa',
        'agente','asesor','cliente','llamada','interacción','interaccion','monitoreo','evaluación',
        'evaluacion','auditoría','auditoria','cumple','cumplimiento','acuerdo','proceso',
        'acorde','debe','realiza','indica','menciona','comenta','informa','refiere',
        'sin embargo','embargo','manera','forma','momento','parte','vez','caso','día','dia',
        'ser','estar','tener','haber','poder','deber','ir','venir','decir','hacer','dar','ver',
        'saber','querer','llegar','poner','parecer','quedar','creer','dejar','seguir','llevar',
        'el/la','o','u','ó','i'
    ]);

    function limpiarTexto(texto) {
        if (!texto) return '';
        return texto
            .toLowerCase()
            .normalize('NFD').replace(/[\u0300-\u036f]/g, '') // quitar acentos
            .replace(/[^a-záéíóúñü\s]/gi, ' ')
            .replace(/\s+/g, ' ')
            .trim();
    }

    function tokenizar(texto) {
        return limpiarTexto(texto).split(' ').filter(function(w) {
            return w.length > 2 && !STOPWORDS.has(w);
        });
    }

    function extraerNgramas(tokens, n) {
        var ngramas = [];
        for (var i = 0; i <= tokens.length - n; i++) {
            ngramas.push(tokens.slice(i, i + n).join(' '));
        }
        return ngramas;
    }

    function contarFrecuencias(items) {
        var freq = {};
        items.forEach(function(item) {
            freq[item] = (freq[item] || 0) + 1;
        });
        return Object.keys(freq).map(function(k) {
            return { texto: k, count: freq[k] };
        }).sort(function(a, b) { return b.count - a.count; });
    }

    function analizarComentarios(registros, topN) {
        topN = topN || 15;
        var unigramas = [];
        var bigramas = [];
        var trigramas = [];

        registros.forEach(function(r) {
            var comentario = r.COMENTARIOS || r.comentarios || '';
            var tokens = tokenizar(comentario);
            unigramas = unigramas.concat(tokens);
            bigramas = bigramas.concat(extraerNgramas(tokens, 2));
            trigramas = trigramas.concat(extraerNgramas(tokens, 3));
        });

        return {
            unigramas: contarFrecuencias(unigramas).slice(0, topN),
            bigramas: contarFrecuencias(bigramas).slice(0, topN),
            trigramas: contarFrecuencias(trigramas).slice(0, topN)
        };
    }

    function renderPhraseList(items, color) {
        if (items.length === 0) return '<p style="color:#94a3b8;font-size:13px;padding:12px;">Sin datos suficientes.</p>';
        var maxCount = items[0].count;
        var html = '<ul class="tm-phrase-list">';
        items.forEach(function(item, i) {
            var pctWidth = Math.max(8, (item.count / maxCount) * 100);
            html += '<li>' +
                '<span class="tm-rank">' + (i + 1) + '</span>' +
                '<span class="tm-phrase-text">' + item.texto + '</span>' +
                '<span class="tm-phrase-count">' + item.count + '</span>' +
                '<span class="tm-bar-bg"><span class="tm-bar-fill" style="width:' + pctWidth + '%;background:' + color + ';"></span></span>' +
            '</li>';
        });
        html += '</ul>';
        return html;
    }

    /* ================================================================
       FUNCIÓN PRINCIPAL
       ================================================================ */
    function cargarPagina(data) {
        if (!data || !data.base_excel) return;

        destroyCharts();

        var records = data.base_excel;
        var total = records.length;

        if (total === 0) {
            document.getElementById('contenidoPrincipal').innerHTML =
                '<div class="no-data-msg">No hay datos disponibles con los filtros seleccionados.</div>';
            setTimeout(notifyHeight, 100);
            return;
        }

        // ── Leer etiquetas desde atributos_evaluacion si están disponibles ──
        if (data.atributos_evaluacion && Array.isArray(data.atributos_evaluacion)) {
            data.atributos_evaluacion.forEach(function(attr) {
                var col = attr.columna || attr.COLUMNA || '';
                ERRORES_CONFIG.forEach(function(cfg) {
                    if (col === cfg.key) {
                        var desc = attr.descripcion || attr.DESCRIPCION || attr.nombre || attr.NOMBRE || '';
                        if (desc) cfg.label = desc;
                    }
                });
            });
        }

        /* ────────────────────────────────────────────
           PRE-CÁLCULOS
           ──────────────────────────────────────────── */
        var conError = records.filter(tieneAlgunError);
        var totalConError = conError.length;
        var pctConError = pct(totalConError, total);

        // Conteos individuales
        var conteosPorQ = {};
        ERRORES_CONFIG.forEach(function(cfg) {
            conteosPorQ[cfg.key] = records.filter(function(r) { return tieneError(r, cfg); }).length;
        });

        /* ── Análisis por error (tabla principal) ── */
        var analisisErrores = ERRORES_CONFIG.map(function(cfg) {
            var casosError = records.filter(function(r) { return tieneError(r, cfg); });
            var totalCasos = casosError.length;
            var incidencia = pct(totalCasos, total);

            // BPO más afectado por tasa
            var porBPO = {};
            var totalPorBPO = {};
            records.forEach(function(r) {
                var b = r.BPO || 'N/A';
                totalPorBPO[b] = (totalPorBPO[b] || 0) + 1;
            });
            casosError.forEach(function(r) {
                var b = r.BPO || 'N/A';
                porBPO[b] = (porBPO[b] || 0) + 1;
            });
            var peorBPO = '—', peorTasa = 0;
            Object.keys(porBPO).forEach(function(b) {
                var tasa = pct(porBPO[b], totalPorBPO[b] || 1);
                if (tasa > peorTasa) { peorBPO = b; peorTasa = tasa; }
            });

            return { key: cfg.key, label: cfg.label, tipo: cfg.tipo,
                     totalCasos: totalCasos, incidencia: incidencia,
                     peorBPO: peorBPO, peorTasa: peorTasa };
        }).sort(function(a, b) { return b.incidencia - a.incidencia; });

        /* ── Evolución semanal ── */
        var porSemana = {};
        records.forEach(function(r) {
            var sem = r.SEMANA || 'N/A';
            if (!porSemana[sem]) {
                porSemana[sem] = { total: 0 };
                Q_KEYS.forEach(function(q) { porSemana[sem][q] = 0; });
            }
            porSemana[sem].total++;
            ERRORES_CONFIG.forEach(function(cfg) {
                if (tieneError(r, cfg)) porSemana[sem][cfg.key]++;
            });
        });
        var semanasOrdenadas = Object.keys(porSemana).sort(function(a, b) {
            return semanaNum(a) - semanaNum(b);
        });

        // Últimas 12 semanas
        var ultimas12 = semanasOrdenadas.slice(-12);
        var ultimas12Set = {};
        ultimas12.forEach(function(s) { ultimas12Set[s] = true; });
        var recsUlt12 = records.filter(function(r) { return ultimas12Set[r.SEMANA]; });

        /* ── Evolución por asesor (todas las semanas) ── */
        var asesoresData = {};
        records.forEach(function(r) {
            var ag  = r.AGENTE || 'Sin nombre';
            var sup = r.SUPERVISOR || 'Sin supervisor';
            var sem = r.SEMANA;
            if (!asesoresData[ag]) asesoresData[ag] = { supervisor: sup, bpo: r.BPO || 'N/A', semanas: {} };
            if (!asesoresData[ag].semanas[sem]) asesoresData[ag].semanas[sem] = { errores: 0, total: 0 };
            asesoresData[ag].semanas[sem].total++;
            if (tieneAlgunError(r)) asesoresData[ag].semanas[sem].errores++;
        });
        var asesoresConError = Object.keys(asesoresData).filter(function(ag) {
            return Object.keys(asesoresData[ag].semanas).some(function(s) {
                return asesoresData[ag].semanas[s].errores > 0;
            });
        }).sort(function(a, b) {
            var eA = 0, eB = 0;
            Object.keys(asesoresData[a].semanas).forEach(function(s) { eA += asesoresData[a].semanas[s].errores; });
            Object.keys(asesoresData[b].semanas).forEach(function(s) { eB += asesoresData[b].semanas[s].errores; });
            return eB - eA;
        });

        /* ── Evolución por supervisor (cantidad de asesores con errores) ── */
        var supervisoresData = {};
        recsUlt12.forEach(function(r) {
            var sup = r.SUPERVISOR || 'Sin supervisor';
            var sem = r.SEMANA;
            var ag  = r.AGENTE || 'Sin nombre';
